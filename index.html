<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فاستبقوا</title>
<meta name="theme-color" content="#1f4e78">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فاستبقوا">
<style>
  :root{--bg:#f4f6f8;--card:#fff;--ink:#1d2433;--mute:#6b7280;--pri:#1f4e78;--ok:#15803d;--okb:#dcfce7;
        --warn:#b45309;--warnb:#fef3c7;--bad:#b91c1c;--badb:#fee2e2;--line:#e5e7eb}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
  header{background:var(--pri);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
  header h1{font-size:18px;margin:0;flex:1;display:flex;align-items:center;gap:8px}
  header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:14px}
  main{max-width:720px;margin:0 auto;padding:12px 12px 90px}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .card h2{font-size:16px;margin:0 0 10px;color:var(--pri)}
  .row{padding:10px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .t{font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;color:var(--ink)}
  .chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
  .chip:disabled{opacity:.55}
  .badge{font-size:12px;border-radius:999px;padding:2px 8px;font-weight:600;white-space:nowrap}
  .b-pend{background:var(--warnb);color:var(--warn)} .b-ok{background:var(--okb);color:var(--ok)} .b-mod{background:#e0e7ff;color:#3730a3} .b-off{background:var(--badb);color:var(--bad)}
  .btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;width:100%}
  .btn.sec{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
  .btn.red{background:#fff;color:var(--bad);border:1.5px solid var(--bad)}
  .btn.sm{width:auto;padding:7px 12px;font-size:14px}
  .tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
  .tab{flex:1;white-space:nowrap;border:0;background:#e5e7eb;border-radius:10px;padding:10px;font-size:14px;color:var(--ink)}
  .tab.on{background:var(--pri);color:#fff}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .kpi{background:#f8fafc;border-radius:10px;padding:10px;text-align:center}
  .kpi b{display:block;font-size:22px} .kpi span{font-size:12px;color:var(--mute)}
  .score{font-size:44px;font-weight:800;text-align:center;margin:4px 0}
  .muted{color:var(--mute);font-size:13px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .day{border-radius:8px;padding:6px 2px;text-align:center;font-size:12px;min-height:50px;background:#f1f5f9}
  .day b{display:block;font-size:13px}
  .bar{height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--pri)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
  th{color:var(--mute);font-weight:600;font-size:12px}
  select,input,textarea{font-size:16px;padding:9px;border-radius:10px;border:1.5px solid var(--line);width:100%;background:#fff;font-family:inherit}
  label.l{display:block;color:var(--mute);font-size:13px;margin:10px 0 4px}
  .msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:20;max-width:90%}
  .spin{text-align:center;padding:30px;color:var(--mute)}
  .flex{display:flex;gap:8px;align-items:center}
  .between{justify-content:space-between}
  .hide{display:none}
  .av{border-radius:50%;object-fit:cover;background:#cbd5e1;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
  .attach{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--pri);border:1.5px dashed var(--pri);border-radius:10px;padding:6px 10px;margin-top:8px;background:#fff}
  .ev{max-width:100%;border-radius:10px;margin-top:8px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
  .modal .box{background:#fff;border-radius:14px;padding:12px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
  .seg{display:flex;gap:6px}.seg .chip{flex:1;text-align:center}
  .cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .cat{background:#fff;border:0;border-radius:14px;padding:14px 10px;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;color:var(--ink)}
  .cat .ic{font-size:30px}
  .prog{display:block;width:80%;height:6px;background:#e5e7eb;border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}
  .itemrow{width:100%;background:#fff;border:0;border-bottom:1px solid var(--line);padding:12px 4px;display:flex;justify-content:space-between;align-items:center;text-align:right;font-size:15px;color:var(--ink);gap:8px}
  .itemrow:last-child{border-bottom:0}.go{font-size:22px;color:var(--mute)}
  .opts{display:grid;grid-template-columns:1fr;gap:8px}
  .opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px;font-size:17px;color:var(--ink);font-weight:600}
  .opt.on{background:var(--pri);border-color:var(--pri);color:#fff}.opt:disabled{opacity:.55}
  .msgs{height:55vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
  .m{display:flex;gap:6px;align-items:flex-end}.m.me{flex-direction:row-reverse}
  .bub{background:#f1f5f9;border-radius:14px;padding:8px 10px;max-width:78%;font-size:15px}.m.me .bub{background:#dbeafe}
  .bub b{font-size:12px;color:var(--pri);display:block}
  .fab{position:fixed;left:16px;bottom:18px;width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:26px;box-shadow:0 4px 12px rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;z-index:15}
  .topbar{display:none;align-items:center;justify-content:center;gap:8px;padding:8px 12px;font-size:14px;text-align:center}
  .topbar.show{display:flex}
  #upd{background:#fef3c7;color:#92400e;cursor:pointer;font-weight:600}
  #net{background:#e0e7ff;color:#3730a3}
  .grp{font-size:15px;color:var(--pri);margin:14px 0 2px;font-weight:700}
  .note{background:#f1f5f9;border-radius:10px;padding:8px 10px;font-size:13px;color:var(--ink);margin:8px 0}
  .b-q{background:#e0e7ff;color:#3730a3}
  .b-ask{background:#ffedd5;color:#c2410c}
  .cnt{position:absolute;top:-4px;right:-4px;background:#dc2626;color:#fff;border-radius:999px;font-size:12px;font-weight:700;min-width:20px;height:20px;line-height:20px;padding:0 5px;text-align:center}
  .cnt.in{position:static;display:inline-block;font-size:11px;min-width:18px;height:18px;line-height:18px}
  .fab{position:fixed}
  .msgbox{position:fixed;left:12px;right:12px;bottom:84px;max-width:560px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:14px 16px;z-index:40;border-top:4px solid var(--ok);animation:up .25s ease}
  .msgbox .mt{font-size:13px;color:var(--mute);margin-bottom:4px}.msgbox .mx{font-size:18px;font-weight:700}
  .msgbox .mh{font-size:14px;color:#334155;background:#f8fafc;border-radius:10px;padding:8px;margin-top:8px;line-height:1.7}
  @keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div id="upd" class="topbar" onclick="applyUpdate()">🔄 فيه تحديث جديد — اضغط للتحديث</div>
<div id="net" class="topbar"></div>
<header><h1 id="title">فاستبقوا ⭐</h1><span id="hbtns"></span></header>
<main id="app"><div class="spin">جاري التحميل...</div></main>
<div class="msg" id="msg"></div>
<button id="fab" class="fab" onclick="fabChat()" aria-label="شات العيلة">💬</button>

<script>
var CFG=null, TOKEN=null, ME=null, PT=null, STATE={}, PINFO={}, SELF=null, HELPER=false, OFF=0, BOOTED=false;
var DUHA='الضحى - صلاة الضحى', PENDING='بانتظار المراجعة', QST='سؤال من ولي الأمر';
function isOpen(st){return st===PENDING||st===QST}
var BADGE={chat:0,pending:0,waiting:0,asked:0};
var LS={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}},
  getJ:function(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},setJ:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
var API='https://script.google.com/macros/s/AKfycbwdjpC6M7UXuXSzyl81rHU0AkUOKf9Salcixtc2fZbU_jTAour9VlPEckfwDLU3XuXh-Q/exec';
function onErr(m){
    if(m.indexOf('SESSION')>-1){ if(PT){PT=null;PINFO={};HELPER=false;LS.set('fs_pt',null);toast('انتهت جلسة ولي الأمر');parentLogin()} else {TOKEN=null;ME=null;LS.set('fs_tok',null);LS.set('fs_me',null);toast(m.replace('SESSION: ',''));loginScreen()} }
    else toast(m.replace(/^Error: /,''))}
/** raw request: rejects with {net:true} when offline, {message} when the server says no */
function api(fn,args){
  return fetch(API,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
    .then(function(r){return r.json()},function(){throw{net:true,message:'مفيش اتصال بالإنترنت — جرّب تاني'}})
    .then(function(j){if(!j.ok)throw{message:j.error};return j.data},function(e){if(e&&e.net)throw e;throw{net:true,message:'السيرفر مش بيرد — جرّب تاني'}})}
function call(fn){var args=[].slice.call(arguments,1);
  return api(fn,args).catch(function(e){onErr((e&&e.message)||String(e));throw e})}
/** quiet: no toast for network problems (background refresh) */
function quiet(fn){var args=[].slice.call(arguments,1);
  return api(fn,args).catch(function(e){if(!e.net)onErr(e.message||String(e));throw e})}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pct(x){return x==null?'—':Math.round(x*100)+'%'}
function toast(t){var m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){m.style.display='none'},3000)}
function view(html,title,btns){$('app').innerHTML=html;$('title').innerHTML=title||'فاستبقوا ⭐';$('hbtns').innerHTML=btns||'';window.scrollTo(0,0);
  var f=$('fab');if(f)f.style.display=(PT||(TOKEN&&ME))&&!$('msgs')?'flex':'none';renderBadges()}
function show(o){return o==='صليتها'?'✅ تم':/^\d+$/.test(o)?o+' مرة':o}
function itemOpts(i){return i&&i.levels?i.levels.map(function(l){return l.opt}).concat(['لا','لا ينطبق']):['تم','جزئي','لا','لا ينطبق']}
function fabChat(){PT&&!HELPER?parent('chat'):chatScreen()}
function loading(){$('app').innerHTML='<div class="spin">جاري التحميل...</div>'}
function color(p){return p==null?'#f1f5f9':p>=.85?'#bbf7d0':p>=.7?'#dcfce7':p>=.5?'#fef3c7':'#fee2e2'}
function statusBadge(s,q){if(q)return'<span class="badge b-q">⏳ محفوظ</span>';if(!s)return'';if(s===QST)return'<span class="badge b-ask">❓ سؤال من بابا</span>';var c=s==='معتمد'||s==='مفعّل'?'b-ok':s==='معدَّل'?'b-mod':s==='موقوف'?'b-off':'b-pend';return'<span class="badge '+c+'">'+esc(s)+'</span>'}
function av(photo,name,size){size=size||36;if(photo)return'<img class="av" src="'+esc(photo)+'" style="width:'+size+'px;height:'+size+'px">';
  return'<span class="av" style="width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size/2.2)+'px">'+esc((name||'?').trim().charAt(0))+'</span>'}
function monthOf(d){return d.slice(0,7)}
function shiftMonth(m,n){var y=+m.slice(0,4),mo=+m.slice(5,7)-1+n;y+=Math.floor(mo/12);mo=((mo%12)+12)%12;return y+'-'+String(mo+1).padStart(2,'0')}
var MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function monthName(m){return MONTHS[+m.slice(5,7)-1]+' '+m.slice(0,4)}
function seg(id,opts,cur){return'<div class="seg" id="'+id+'">'+opts.map(function(o){return'<button type="button" class="chip '+(o===cur?'on':'')+'" onclick="segPick(this)">'+esc(o)+'</button>'}).join('')+'</div>'}
function segPick(b){[].forEach.call(b.parentNode.children,function(x){x.classList.remove('on')});b.classList.add('on')}
function segVal(id){var b=$(id)&&$(id).querySelector('.on');return b?b.textContent:''}
function localToday(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nowS(){return Date.now()+OFF}
function hm(ms){var d=new Date(ms),h=d.getHours(),m=('0'+d.getMinutes()).slice(-2);return(h%12||12)+':'+m+(h<12?' ص':' م')}
function dur(ms){var m=Math.max(0,Math.round(ms/60000));return m<60?m+' دقيقة':Math.floor(m/60)+':'+('0'+m%60).slice(-2)+' ساعة'}
function cityField(id,cur){var opts=(CFG&&CFG.cities)||[];cur=cur||'الرياض';var other=opts.indexOf(cur)<0;
  return'<select id="'+id+'" onchange="$(\''+id+'x\').classList.toggle(\'hide\',this.value!==\'*\')">'+opts.map(function(o){return'<option'+(o===cur?' selected':'')+'>'+esc(o)+'</option>'}).join('')+
    '<option value="*"'+(other?' selected':'')+'>مدينة تانية…</option></select><input id="'+id+'x" class="'+(other?'':'hide')+'" style="margin-top:6px" placeholder="اكتب المدينة والدولة بالإنجليزي (مثال: Amman, Jordan)" value="'+(other?esc(cur):'')+'">'}
function cityVal(id){var v=$(id).value;return v==='*'?$(id+'x').value.trim():v}

// ---------- app update (service worker) + connection bar
var SWREG=null,SWGO=false;
function regSW(){if(!('serviceWorker' in navigator))return;
  navigator.serviceWorker.register('sw.js').then(function(reg){SWREG=reg;
    function watch(w){if(w)w.addEventListener('statechange',function(){if(w.state==='installed'&&navigator.serviceWorker.controller)$('upd').classList.add('show')})}
    if(reg.waiting&&navigator.serviceWorker.controller)$('upd').classList.add('show');
    reg.addEventListener('updatefound',function(){watch(reg.installing)});
    setInterval(function(){reg.update().catch(function(){})},30*60000)}).catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(SWGO){SWGO=false;location.reload()}})}
function applyUpdate(){SWGO=true;if(SWREG&&SWREG.waiting)SWREG.waiting.postMessage('skip');else location.reload()}
function netBar(){var n=outbox().length,off=navigator.onLine===false,b=$('net');
  if(!off&&!n){b.classList.remove('show');return}
  b.innerHTML=off?'📴 مفيش نت — اللي بتسجله هيتحفظ ويتبعت لوحده'+(n?' ('+n+' مستني)':''):'⏳ جاري إرسال '+n+' تسجيل محفوظ...';b.classList.add('show')}
window.addEventListener('online',function(){netBar();flush()});window.addEventListener('offline',netBar);

// ---------- outbox (offline submissions)
function outbox(){return LS.getJ('fs_out')||[]}
function saveOut(o){if(!LS.setJ('fs_out',o)){o.forEach(function(x){x.list.forEach(function(a){delete a.file})});LS.setJ('fs_out',o)}netBar()}
var FLUSHING=false;
function flush(){
  if(FLUSHING)return;var o=outbox();if(!o.length)return netBar();
  if(navigator.onLine===false)return netBar();
  FLUSHING=true;netBar();var job=o[0];
  api('apiSubmit',[job.tok,job.date,job.list]).then(function(r){
    var q=outbox().filter(function(x){return x.id!==job.id});saveOut(q);FLUSHING=false;
    if(r.rejected&&r.rejected.length)toast('⏰ '+r.rejected.length+' تسجيل اتقفل وقته قبل ما يتبعت');
    else if(job.late)toast('✅ اتبعت');
    if(r.offline)toast('✅ اتبعت — واتعلّم «اتسجل أوفلاين» لبابا وماما');
    if(r.data&&SELF===job.tok&&STATE.date===job.date&&!q.some(function(x){return x.tok===job.tok&&x.date===job.date}))setDay(r.data,true);
    flush()
  },function(e){FLUSHING=false;
    if(e&&e.net){o=outbox();if(o[0]&&o[0].id===job.id){o[0].late=1;saveOut(o)}setTimeout(flush,20000);return}
    saveOut(outbox().filter(function(x){return x.id!==job.id}));
    if((e.message||'').indexOf('SESSION')>-1)return onErr(e.message);
    toast('ما اتبعتش: '+String(e.message||'').replace(/^Error: /,''));flush()})}
setInterval(flush,60000);

// ---------- prayer-time windows (same rules as the server)
function allowed(kind,item,opts){
  var ae=STATE.ent&&STATE.ent[kind+'|'+item];if(ae&&ae.status===QST)return opts;
  var T=STATE.data&&STATE.data.times;if(!T||!CFG.rules||!CFG.rules.TIME_RULES)return opts;
  var t=nowS(),MIN=60000,R=CFG.rules,w=null;
  if(kind==='صلاة'){var i=CFG.prayers.indexOf(item);if(i<0)return opts;
    var st=[T.fajr,T.dhuhr,T.asr,T.maghrib,T.isha][i],en=[T.sunrise,T.asr,T.maghrib,T.isha,T.nextFajr][i],P=CFG.prayerOpts;
    if(t<st)return[];if(t<st+R.MOSQUE_MIN*MIN)return P;if(t<st+R.ONTIME_MIN*MIN)return P.slice(1);if(t<en)return P.slice(2);return[P[P.length-1]]}
  w=winOf(kind,item,T);if(!w)return opts;
  return t>=w[0]&&t<w[1]?opts:[]}
function winOf(kind,item,T){var MIN=60000;
  if(kind==='سنة')return item===DUHA?[T.sunrise+30*MIN,T.dhuhr-30*MIN]:[0,T.nextFajr];
  if(kind==='ذكر')return{'أذكار الصباح':[T.fajr,T.sunrise],'أذكار المساء':[T.asr,T.maghrib],'أذكار الاستيقاظ من النوم':[T.fajr,T.dhuhr],'أذكار النوم':[T.isha,T.nextFajr]}[item]||[0,T.nextFajr];
  return null}
function windowNote(it){
  var we=STATE.ent&&STATE.ent[it.kind+'|'+it.item];if(we&&we.status===QST)return'❓ بابا سألك على البند ده — تقدر تعدّله أو ترد عليه';
  var T=STATE.data&&STATE.data.times;if(!T||!CFG.rules||!CFG.rules.TIME_RULES)return'';
  var t=nowS(),MIN=60000,R=CFG.rules;
  if(it.kind==='صلاة'){var i=CFG.prayers.indexOf(it.item),st=[T.fajr,T.dhuhr,T.asr,T.maghrib,T.isha][i],en=[T.sunrise,T.asr,T.maghrib,T.isha,T.nextFajr][i];
    if(t<st)return'⏰ الأذان الساعة '+hm(st)+' — تقدر تسجّل بعده';
    if(t<st+R.MOSQUE_MIN*MIN)return'🕌 «مسجد» متاح لحد '+hm(st+R.MOSQUE_MIN*MIN);
    if(t<st+R.ONTIME_MIN*MIN)return'⏳ «في وقتها» متاح لحد '+hm(st+R.ONTIME_MIN*MIN);
    if(t<en)return'⌛ عدّى وقت «في وقتها» — الوقت بيخلص '+hm(en);
    return'❌ وقت الصلاة خلص (فائتة)'}
  var w=winOf(it.kind,it.item,T);if(!w)return'';
  if(t<w[0])return'⏰ يفتح الساعة '+hm(w[0]);
  if(t>=w[1])return'⌛ الوقت خلص';
  return w[0]?'🕐 متاح لحد '+hm(w[1]):''}
function nextPrayer(){
  var T=STATE.data&&STATE.data.times;if(!T||STATE.date!==CFG.today)return'';

// ---------- response messages (sheet «الرسايل»)
var NEG_VALS=['لا','لا ينطبق','لم يصلِّ'];
function myAge(){if(!ME||ME.adult||!ME.birth)return 99;return +CFG.today.slice(0,4)-ME.birth}
function msgUses(){return LS.getJ('fs_mu_'+(ME&&ME.user))||{}}
function pickMsg(kind,item,value,stage){
  var L=(CFG&&CFG.msgs)||[];if(!L.length||!ME)return null;
  var age=myAge(),sex=ME.sex||'ولد',week=Date.now()-7*864e5,uses=msgUses(),best=[],bestScore=0;
  L.forEach(function(m,i){
    if(m.kind!==kind)return;
    if(m.item!=='*'&&m.item!==item)return;
    if(m.vals==='*'){if(NEG_VALS.indexOf(value)>-1)return}else if(m.vals.indexOf(String(value))<0)return;
    if(m.age==='تحت 10'&&age>=10)return;if(m.age==='10 وفوق'&&age<10)return;
    if(m.sex!=='الكل'&&m.sex!==sex)return;
    if(m.stage!=='الاتنين'&&m.stage!==stage)return;
    var key=m.kind+'|'+m.item+'|'+m.text;
    if(m.week&&(uses[key]||[]).filter(function(t){return t>week}).length>=m.week)return;
    var sc=(m.item!=='*'?2:1)+(m.vals!=='*'?1:0);
    if(sc>bestScore){bestScore=sc;best=[]}if(sc===bestScore)best.push(m)});
  if(!best.length)return null;
  var m=best[Math.floor(Math.random()*best.length)],k=m.kind+'|'+m.item+'|'+m.text;
  uses[k]=(uses[k]||[]).filter(function(t){return t>week}).concat([Date.now()]);LS.setJ('fs_mu_'+ME.user,uses);
  return m}
var MSGQ=[],MSGT=null;
function showMsg(m,title){if(!m)return;MSGQ.push({m:m,title:title||''});if(MSGQ.length===1)nextMsg()}
function nextMsg(){var b=$('msgbox');if(!MSGQ.length){if(b)b.remove();return}
  var x=MSGQ[0];if(!b){b=document.createElement('div');b.id='msgbox';b.className='msgbox';b.onclick=closeMsg;document.body.appendChild(b)}
  b.innerHTML=(x.title?'<div class="mt">'+esc(x.title)+'</div>':'')+'<div class="mx">'+esc(x.m.text)+'</div>'+(x.m.hadith?'<div class="mh">'+esc(x.m.hadith)+'</div>':'')+
    (MSGQ.length>1?'<div class="muted" style="font-size:11px;margin-top:4px">اضغط للي بعدها ('+(MSGQ.length-1)+')</div>':'');
  clearTimeout(MSGT);MSGT=setTimeout(closeMsg,x.m.hadith?9000:5000)}
function closeMsg(){MSGQ.shift();nextMsg()}

function r12(){if(!R12_NAMES)R12_NAMES=(CFG.sunnah||[]).filter(function(s){return['الفجر','الظهر','المغرب','العشاء'].indexOf(s.prayer)>-1&&s.name!=='الوتر'}).map(function(s){return s.prayer+' - '+s.name});
  return R12_NAMES.length&&R12_NAMES.every(function(k){var e=STATE.ent['سنة|'+k];return e&&(e.status==='معدَّل'?e.parent:e.self)==='صليتها'})}
/** after fresh data: messages for things the parent approved/changed since last time */
function approvalMsgs(d){
  if(!ME||!d||!d.entries)return;var key='fs_seen_'+ME.user,seen=LS.getJ(key),first=!seen;seen=seen||{};
  var news=[];
  d.entries.forEach(function(e){if(!e.id||isOpen(e.status)||seen['e'+e.id])return;seen['e'+e.id]=1;news.push(e)});
  (d.pens||[]).forEach(function(p){var k='p'+p.id+(p.repaired?'r':'');if(seen[k])return;seen[k]=1;if(p.type!=='هدية')news.push({pen:p})});
  var day=d.day;if(day&&day.honesty&&!seen['h'+d.date]){seen['h'+d.date]=1;news.push({honest:1})}
  var st=d.summary&&d.summary.streak||0;if(st>=3&&!seen['s'+d.date+'_'+st]){seen['s'+d.date+'_'+st]=1;news.push({streak:st})}
  var y=new Date(CFG.today+'T12:00:00Z');y.setUTCDate(y.getUTCDate()-1);var old=d.date<y.toISOString().slice(0,10);
  LS.setJ(key,seen);if(first||old||!news.length)return;
  var shown=0;news.forEach(function(n){if(shown>=4)return;var m=null,t='';
    if(n.pen){var p=n.pen;if(p.type==='نقاط'){m={text:(p.count>0?'🌟 ':'🔻 ')+(p.count>0?'+':'')+p.count+' — '+p.behavior,hadith:''};t='من '+(p.who||'بابا')}
      else{m=pickMsg('خصم',p.repaired?'*':p.behavior,p.repaired?'اعتذر':'*','اعتماد')||pickMsg('خصم','*',p.repaired?'اعتذر':'x','اعتماد');t='⚠️ '+p.behavior+(p.repaired?' — اعتذرت ✅':'')}}
    else if(n.honest){m=pickMsg('يوم','صدق','*','اعتماد');t='⭐ +'+day.honesty}
    else if(n.streak){m=pickMsg('يوم','ستريك','*','اعتماد');t='🔥 '+n.streak+' أيام ناجحة ورا بعض'}
    else{var e=n,v=e.status==='معدَّل'?e.parent:e.self;
      if(e.flag==='صلّح بعد السؤال'){m=pickMsg('يوم','صلّح','*','اعتماد');t='✅ بابا اعتمد: '+itemLabel(e.kind,e.item)}
      else{m=pickMsg(e.kind,e.item,v,'اعتماد');t=(e.status==='معدَّل'?'✏️ بابا عدّل «'+itemLabel(e.kind,e.item)+'» لـ '+show(v):'✅ بابا اعتمد: '+itemLabel(e.kind,e.item))}
      if(!m&&e.status==='معدَّل')m={text:'بابا عدّل التقييم ده — راجعه 🤍',hadith:''}}
    if(m){showMsg(m,t);shown++}});
  if(news.length>shown&&shown)showMsg({text:'وفيه '+(news.length-shown)+' حاجة تانية اتراجعت 👀',hadith:''},'')}

// ---------- files
function readFile(file,maxDim,quality){return new Promise(function(res,rej){
  if(!file)return res('');
  if(/^audio\//.test(file.type)){ if(file.size>4*1024*1024){toast('التسجيل كبير — خليه أقل من دقيقة');return rej()}
    var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(file);return}
  if(!/^image\//.test(file.type)){toast('اختار صورة أو تسجيل صوت');return rej()}
  var img=new Image(),url=URL.createObjectURL(file);
  img.onload=function(){var s=Math.min(1,maxDim/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',quality))};
  img.onerror=function(){toast('الصورة مش مقروءة');rej()};img.src=url})}
function squareAvatar(file){return new Promise(function(res,rej){
  if(!file)return res('');var img=new Image(),url=URL.createObjectURL(file);
  img.onload=function(){var m=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=180;
    c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,180,180);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.75))};
  img.onerror=function(){toast('الصورة مش مقروءة');rej()};img.src=url})}
function showEvidence(id){

  call('apiEvidence',PT||TOKEN,id).then(function(u){
    var inner=/^data:audio/.test(u)?'<audio controls src="'+u+'" style="width:100%"></audio>':'<img class="ev" src="'+u+'">';
    d.firstChild.innerHTML=inner+'<div style="height:8px"></div><button class="btn sec" onclick="this.closest(\'.modal\').remove()">قفل</button>'}).catch(function(){d.remove()})}

  outbox().forEach(function(j){if(j.tok===SELF&&j.date===d.date)j.list.forEach(function(a){var e=ent[a.kind+'|'+a.item];
    if(!e||isOpen(e.status))ent[a.kind+'|'+a.item]={id:e?e.id:'',kind:a.kind,item:a.item,self:a.value,status:PENDING,parent:'',file:e?e.file:'',cmts:e?e.cmts:[],q:1}})});

    var list=r.items;STATE.pending=list;STATE.dec={};STATE.flag={};STATE.gifts=r.gifts;
    BADGE.pending=list.filter(function(x){return x.status===PENDING}).length+r.gifts.length;
    var h=pTabs('review');
    if(r.gifts.length){h+='<div class="card"><h2>🎁 نقاط الأخوّة</h2>';
      r.gifts.forEach(function(g){h+='<div class="row flex between"><span><b>'+esc(g.from)+'</b> ← <b>'+esc(g.to)+'</b>: «'+esc(g.reason)+'» <span class="muted">'+g.date+'</span></span><span class="flex">'+
        '<button class="btn sm" onclick="giftDecide(\''+g.id+'\',true)">✅</button><button class="btn sm red" onclick="giftDecide(\''+g.id+'\',false)">❌</button></span></div>'});h+='</div>'}
    if(!list.length&&!r.gifts.length)return pv(h+'<div class="card"><h2>مفيش حاجة مستنية مراجعة 👌</h2></div>');
    var groups={};list.forEach(function(x){(groups[x.kid+'|'+x.date]=groups[x.kid+'|'+x.date]||[]).push(x)});
    Object.keys(groups).forEach(function(g){var it=groups[g],gi=Object.keys(groups).indexOf(g),open=it.filter(function(x){return x.status===PENDING}).length;
      h+='<div class="card"><div class="flex between" style="margin-bottom:6px"><h2 style="margin:0">'+(it[0].adult?'🙋 ':'')+esc(it[0].display)+' — '+it[0].date+'</h2>'+
        (open?'<button class="btn sm" onclick="approveGroup(\''+esc(g)+'\')">اعتماد الكل ✅</button>':'')+'</div>';
      it.forEach(function(x){var opts=reviewOpts(x),asked=x.status===QST;
        h+='<div class="row" id="rw_'+x.id+'"><div class="t"><span>'+esc(reviewLabel(x))+(x.note?' <span class="badge b-q">📴 '+esc(x.note)+'</span>':'')+(x.flag==='صلّح بعد السؤال'?' <span class="badge b-ok">✏️ صلّح بعد سؤالك</span>':'')+'</span><span class="muted">قال: <b>'+esc(show(x.self))+'</b></span></div>';
        if(asked)h+='<span class="badge b-ask">❓ مستني رد '+esc(x.display)+'</span>';
        else{h+='<div class="chips">';
          opts.forEach(function(o){h+='<button class="chip '+(o===x.self?'on':'')+'" onclick="decide(this,\''+x.id+'\',\''+esc(o)+'\')">'+esc(show(o))+'</button>'});
          h+='</div><div id="fl_'+x.id+'" class="hide" style="margin-top:6px"><span class="muted">التعديل ده كان:</span> '+seg('fs_'+x.id,['غلطة','مش صدق'],'')+'<span class="muted" style="font-size:12px">«غلطة» = مكافأة الصدق تفضل. لو ما اخترتش = «مش صدق».</span></div>'}
        h+=x.cmts.map(function(c){return'<div class="bub" style="margin-top:6px;max-width:100%"><b>'+esc(c.name)+'</b>'+esc(c.text)+'</div>'}).join('');
        h+=(asked?'':'<button class="btn sm" style="margin-top:6px" onclick="approveOne(\''+x.id+'\')">✅ اعتماد</button> ')+evBtn(x.file)+' <button class="btn sm sec" style="margin-top:6px" onclick="toggleAsk(\''+x.id+'\')">💬 سؤال / تعليق</button>'+
          '<div id="ak_'+x.id+'" class="hide" style="margin-top:6px"><textarea id="akt_'+x.id+'" rows="2" placeholder="مثال: إنت متأكد إنها العشاء مش المغرب؟"></textarea><div class="flex" style="margin-top:6px">'+
          (asked?'':'<button class="btn sm" onclick="askItem(\''+x.id+'\',true)">رجّعه بسؤال ❓</button>')+'<button class="btn sm sec" onclick="askItem(\''+x.id+'\',false)">تعليق بس 👍</button></div></div></div>'});
      h+='<button class="btn sm sec" style="margin-top:8px" onclick="setOtherForm('+gi+')">➕ عدّل بند تاني لليوم ده</button><div id="so_'+gi+'"></div></div>'});
    STATE.groupKeys=Object.keys(groups);
    pv(h+'<p class="muted">اختار تقييم مختلف لو عايز تعدّل، وبعدين «اعتماد الكل». «رجّعه بسؤال» بيرجّع البند للطفل يرد أو يصلّح، ومش بيتعتمد لحد ما يرد. «اتسجل أوفلاين» = اتسجل وقت ما كان مفيش نت واتبعت بعد ما الوقت قفل.</p>');
  });
}
function decide(btn,id,val){STATE.dec[id]=val;[].forEach.call(btn.parentNode.children,function(b){b.classList.remove('on')});btn.classList.add('on');
  var x=STATE.pending.filter(function(y){return y.id===id})[0],f=$('fl_'+id);if(f)f.classList.toggle('hide',!x||x.self===val)}
function approveOne(id){var x=STATE.pending.filter(function(y){return y.id===id})[0];if(!x)return;
  call('apiReview',PT,[{id:id,value:STATE.dec[id]||x.self,flag:segVal('fs_'+id)==='غلطة'?'غلطة':''}]).then(function(n){
    var r=$('rw_'+id);if(r){r.innerHTML='<span class="muted">✅ اتعتمد: '+esc(reviewLabel(x))+' — '+esc(show(STATE.dec[id]||x.self))+'</span>'}
    x.status='معتمد';BADGE.pending=Math.max(0,BADGE.pending-1);renderBadges();toast('اتعتمد ✅')})}
function toggleAsk(id){$('ak_'+id).classList.toggle('hide')}
function askItem(id,ret){var t=$('akt_'+id).value.trim();if(!t)return toast('اكتب الرسالة');
  call('apiAsk',PT,id,t,ret).then(function(){toast(ret?'اترجّع للطفل ❓':'اتبعت 👍');pReview()})}
function giftDecide(id,ok){call('apiGiftDecide',PT,id,ok).then(function(){toast(ok?'🎁 اتعتمدت':'اترفضت');pReview()})}
function approveGroup(g){var it=STATE.pending.filter(function(x){return x.kid+'|'+x.date===g&&x.status===PENDING});
  call('apiReview',PT,it.map(function(x){return{id:x.id,value:STATE.dec[x.id]||x.self,flag:segVal('fs_'+x.id)==='غلطة'?'غلطة':''}})).then(function(n){toast('اتعتمد '+n+' بند ✅');pReview()})}
function allKeys(adult){var L=[];CFG.prayers.forEach(function(p){L.push(['صلاة',p,CFG.prayerOpts])});
  (CFG.sunnah||[]).forEach(function(s){L.push(['سنة',s.prayer+' - '+s.name,['صليتها','لا']])});
  (CFG.azkar||[]).forEach(function(z){L.push(['ذكر',z.name,z.levels.map(function(l){return l.opt})])});
  if(!adult)L.push(['شاشات','الشاشات',CFG.screenOpts]);
  ((adult?CFG.aitems:CFG.items)||[]).forEach(function(i){L.push(['بند',i.name,itemOpts(i)])});return L}
function setOtherForm(gi){var g=STATE.groupKeys[gi],x=STATE.pending.filter(function(y){return y.kid+'|'+y.date===g})[0],L=allKeys(x.adult);STATE.soList=L;
  $('so_'+gi).innerHTML='<label class="l">البند</label><select id="sok_'+gi+'" onchange="soOpts('+gi+')">'+L.map(function(k,i){return'<option value="'+i+'">'+esc(itemLabel(k[0],k[1]))+'</option>'}).join('')+'</select>'+
    '<label class="l">التقييم الصح</label><select id="sov_'+gi+'"></select><div style="height:8px"></div><button class="btn sm" onclick="saveOther('+gi+')">حفظ</button>'+
    '<p class="muted" style="font-size:12px">بيتسجل كتعديل منك («غلطة»)، فمكافأة الصدق ما تتأثرش، وبيعدّي مواعيد القفل.</p>';soOpts(gi)}
function soOpts(gi){var k=STATE.soList[+$('sok_'+gi).value];$('sov_'+gi).innerHTML=k[2].map(function(o){return'<option value="'+esc(o)+'">'+esc(show(o))+'</option>'}).join('')}
function saveOther(gi){var g=STATE.groupKeys[gi].split('|'),k=STATE.soList[+$('sok_'+gi).value];
  call('apiParentSet',PT,g[0],g[1],k[0],k[1],$('sov_'+gi).value,'غلطة').then(function(){toast('اتحفظ ✅');pReview()})}

function pLog(){

    STATE.waiting=d.waiting;STATE.logFile='';

    var kids='<select id="lk">'+d.kidsList.map(function(k){return'<option value="'+esc(k.user)+'">'+esc(k.display)+'</option>'}).join('')+'</select>';
    var h=pTabs('log')+'<div class="card"><h2>تسجيل جديد</h2>'+seg('lt',['خصم سلوك','نقاط إضافية'],'خصم سلوك')+
      '<label class="l">الطفل</label>'+kids+
      '<div id="lpen"><label class="l">السلوك</label><select id="lb">'+CFG.pens.map(function(k){return'<option>'+esc(k)+'</option>'}).join('')+'</select>'+

      '<label class="l">السبب</label><input id="lrs" placeholder="مثال: ساعد أخوه في المذاكرة"></div>'+
      (PINFO.main?'<label class="l">من</label>'+seg('lw',['بابا','ماما'],'بابا'):'')+
      '<label class="l">التاريخ</label><input id="ld" type="date" value="'+CFG.today+'" max="'+CFG.today+'">'+
      '<label class="attach" id="latt">📎 إرفاق دليل (صورة أو تسجيل صوت)<input type="file" accept="image/*,audio/*" class="hide" onchange="pickLogFile(this)"></label>'+
      '<div style="height:12px"></div><button class="btn" id="lgo" onclick="addLog()">تسجيل</button></div>';
    h+='<div class="card"><h2>سجل النهارده</h2>';

      '<div class="flex" style="margin-top:6px">'+(p.type==='خصم'?'<button class="btn sm sec" onclick="togRep(\''+p.id+'\')">'+(p.repaired?'إلغاء الاعتذار':'اعتذر')+'</button>':'')+
      '<button class="btn sm red" onclick="delLog(\''+p.id+'\')">حذف</button>'+evBtn(p.file).replace('margin-top:6px','')+'</div></div>'});
    pv(h+'</div>');
    $('lt').addEventListener('click',function(){var pts=segVal('lt')==='نقاط إضافية';$('lpen').classList.toggle('hide',pts);$('lpts').classList.toggle('hide',!pts)});
  });

function pickLogFile(inp){readFile(inp.files[0],1280,.7).then(function(d){STATE.logFile=d;$('latt').firstChild.textContent='✅ الدليل جاهز '})}
function addLog(){var pts=segVal('lt')==='نقاط إضافية';$('lgo').disabled=true;
  var a=pts?['نقاط',$('lrs').value,$('lpv').value,false]:['خصم',$('lb').value,$('lc').value,$('lr').checked];
  call('apiLog',PT,$('lk').value,$('ld').value,a[0],a[1],a[2],a[3],segVal('lw'),STATE.logFile).then(function(){toast('اتسجل ✅');pLog()}).catch(function(){$('lgo').disabled=false})}
function togRep(id){call('apiToggleRepair',PT,id).then(pLog)}
function delLog(id){if(confirm('حذف التسجيل ده؟'))call('apiDeleteLog',PT,id).then(pLog)}

    list.sort(function(a,b){return(a.status==='بانتظار الموافقة'?0:1)-(b.status==='بانتظار الموافقة'?0:1)});

        '<div style="height:10px"></div><button class="btn" onclick="addHelper()">إضافة مساعد</button></div>';

      if(pt){h+='<h2 style="margin-top:14px">الصلاة ('+pt+' صلاة)</h2><table>';for(o in k.prayer)h+='<tr><td>'+esc(o)+'</td><td>'+k.prayer[o]+'</td><td>'+Math.round(k.prayer[o]/pt*100)+'%</td></tr>';h+='</table>'}
      var st=0;for(o in k.screens)st+=k.screens[o];
      if(st){h+='<h2 style="margin-top:14px">الشاشات ('+st+' يوم)</h2><table>';for(o in k.screens)h+='<tr><td>'+esc(o)+'</td><td>'+k.screens[o]+' يوم</td></tr>';h+='</table>'}
      var pk=Object.keys(k.pens);
      if(pk.length){h+='<h2 style="margin-top:14px">خصومات السلوك</h2><table>';pk.forEach(function(p){h+='<tr><td>'+esc(p)+'</td><td>'+k.pens[p]+' مرة</td></tr>'});h+='</table>'}
      h+='</div>'});
    pv(h+'<button class="btn sec" onclick="exportCsv()">تنزيل إحصائيات الشهر (CSV)</button><p class="muted">البيانات الخام في شيت «التسجيلات» و«سجل الخصومات والمكافآت».</p>')});
}
function pDay(kid,date){loading();STATE.pday={kid:kid,date:date};
  call('apiParentDay',PT,kid,date).then(function(d){STATE.pdayData=d;var day=d.day,ent={};d.entries.forEach(function(e){ent[e.kind+'|'+e.item]=e});
    var h='<div class="card"><div class="flex">'+av(d.photo,d.display,44)+'<div><h2 style="margin:0">'+esc(d.display)+'</h2><span class="muted">'+date+'</span></div></div>';
    h+=day?'<div class="kpis" style="margin-top:10px"><div class="kpi"><b>'+(day.reviewed?pct(day.pct):'⏳')+'</b><span>النسبة</span></div><div class="kpi"><b>'+day.total+'</b><span>نقطة من '+day.max+'</span></div><div class="kpi"><b>'+(day.success?'⭐':'—')+'</b><span>يوم ناجح</span></div></div>'+
      '<div class="muted" style="margin-top:6px">'+[day.sunnah?'🌙 سنن +'+day.sunnah:'',day.azkar?'📿 أذكار +'+day.azkar:'',day.gift?'🎁 +'+day.gift:'',day.honesty?'⭐ صدق +'+day.honesty:'',day.pen?'⚠️ خصم '+day.pen:'',day.manual?'🌟 نقاط '+day.manual:''].filter(Boolean).join(' · ')+'</div>'
      :'<p class="muted">مفيش تسجيل في اليوم ده.</p>';
    h+='</div>';
    var groups=[['🕌 الصلاة',function(k){return k[0]==='صلاة'||k[0]==='سنة'}],['📿 الأذكار',function(k){return k[0]==='ذكر'}],['📱 الشاشات',function(k){return k[0]==='شاشات'}],['📚 البنود',function(k){return k[0]==='بند'}]];
    var L=allKeys(d.adult);STATE.soList=L;
    groups.forEach(function(g){var ks=L.filter(g[1]);if(!ks.length)return;h+='<div class="card"><h2>'+g[0]+'</h2>';
      ks.forEach(function(k){var e=ent[k[0]+'|'+k[1]],v=e?(e.status==='معدَّل'?e.parent:e.self):'';
        if(!e&&k[0]==='سنة')return;
        h+='<div class="row"><div class="t"><span>'+esc(itemLabel(k[0],k[1]))+'</span>'+(e?statusBadge(e.status):'')+'</div>'+
          (e?'<b>'+esc(show(v)||'—')+'</b>'+(e.status==='معدَّل'&&e.self?' <span class="muted">(قال: '+esc(show(e.self))+')</span>':'')+(e.note?' <span class="badge b-q">'+esc(e.note)+'</span>':'')+(e.flag?' <span class="badge b-mod">'+esc(e.flag)+'</span>':''):'<span class="muted">لسه ما سجّلش</span>')+
          (e&&e.cmts&&e.cmts.length?e.cmts.map(function(c){return'<div class="bub" style="margin-top:6px;max-width:100%"><b>'+esc(c.name)+'</b>'+esc(c.text)+'</div>'}).join(''):'')+evBtn(e&&e.file)+'</div>'});
      h+='</div>'});
    if(d.pens.length){h+='<div class="card"><h2>👨‍👩‍👧 خصومات ومكافآت</h2>';d.pens.forEach(function(p){h+='<div class="row">'+(p.type==='هدية'?'🎁 +'+p.count+' — '+esc(p.behavior):p.type==='نقاط'?(p.count>0?'🌟 +':'🔻 ')+p.count+' — '+esc(p.behavior):'⚠️ '+esc(p.behavior)+' × '+p.count+(p.repaired?' — اعتذر ✅':''))+(p.who?' <span class="muted">('+esc(p.who)+')</span>':'')+evBtn(p.file)+'</div>'});h+='</div>'}
    h+='<div class="card"><h2>✏️ تعديل بند</h2><select id="pdk" onchange="pdOpts()">'+L.map(function(k,i){return'<option value="'+i+'">'+esc(itemLabel(k[0],k[1]))+'</option>'}).join('')+'</select>'+
      '<label class="l">التقييم الصح</label><select id="pdv"></select><div style="height:8px"></div><button class="btn sm" onclick="pdSave()">حفظ</button>'+
      '<p class="muted" style="font-size:12px">بيتسجل كتعديل منك («غلطة»)، فمكافأة الصدق ما تتأثرش، وبيعدّي مواعيد القفل.</p></div>';
    view(h,'📅 '+esc(d.display),'<button onclick="pStats(\''+date.slice(0,7)+'\')">رجوع</button>');pdOpts()})}
function pdOpts(){var k=STATE.soList[+$('pdk').value];$('pdv').innerHTML=k[2].map(function(o){return'<option value="'+esc(o)+'">'+esc(show(o))+'</option>'}).join('')}
function pdSave(){var k=STATE.soList[+$('pdk').value],x=STATE.pday;
  call('apiParentSet',PT,x.kid,x.date,k[0],k[1],$('pdv').value,'غلطة').then(function(){toast('اتحفظ ✅');pDay(x.kid,x.date)})}
function exportCsv(){var d=STATE.stats,rows=[['الاسم','التاريخ','النسبة','النقاط','ناجح','مراجَع']];
  d.kids.forEach(function(k){k.days.forEach(function(x){rows.push([k.display,x.date,Math.round(x.pct*100)+'%',x.total,x.success?'نعم':'لا',x.reviewed?'نعم':'لا'])})});
  var csv='﻿'+rows.map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
  var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='stats-'+d.month+'.csv';document.body.appendChild(a);a.click();a.remove()}

// ---------- family chat
var CHAT_T=null;
function chatScreen(){
  STATE.chatFile='';STATE.chatWho=STATE.chatWho||'بابا';STATE.chatLast=-1;STATE.screen='chat';
  var h=(PT&&!HELPER?pTabs('chat'):'')+'<div class="card" style="padding:10px"><div id="msgs" class="msgs"><div class="spin">جاري التحميل...</div></div></div>'+
    '<div class="card" style="padding:10px">'+(PT&&PINFO.main?'<div style="margin-bottom:8px">'+seg('cw',['بابا','ماما'],STATE.chatWho)+'</div>':'')+
    '<div class="flex"><textarea id="ct" rows="2" placeholder="اكتب رسالة..." style="flex:1"></textarea>'+
    '<button class="btn sm" id="cgo" onclick="chatSend()">إرسال</button></div>'+
    '<label class="attach" id="catt">📎 صورة أو صوت<input type="file" accept="image/*,audio/*" class="hide" onchange="pickChatFile(this)"></label></div>';
  view(h,'💬 شات العيلة',PT&&!HELPER?pBtns():backBtn('kidHome()'));
  if(PT&&PINFO.main)$('cw').addEventListener('click',function(){STATE.chatWho=segVal('cw')});
  if(CHAT_T)clearInterval(CHAT_T);
  chatLoad(true);CHAT_T=setInterval(function(){if(document.getElementById('msgs'))chatLoad(false);else{clearInterval(CHAT_T);CHAT_T=null}},8000);
}
var CHAT_PH=null;
function chatLoad(scroll){
  var tok=PT||TOKEN;
  (scroll?call:quiet)('apiChat',tok,!CHAT_PH).then(function(d){if(d.photos)CHAT_PH=d.photos;var box=$('msgs');if(!box)return;
    var atEnd=box.scrollHeight-box.scrollTop-box.clientHeight<40;
    var lastT=d.msgs.length?d.msgs[d.msgs.length-1].t:0;if(lastT>chatSince())LS.set(chatKey(),String(lastT));if(BADGE.chat){BADGE.chat=0;renderBadges()}
    if(STATE.chatLast===d.msgs.length&&!scroll)return;STATE.chatLast=d.msgs.length;
    if(!d.msgs.length){box.innerHTML='<div class="muted" style="text-align:center;padding:20px">لسه مفيش رسايل — ابدأ إنت 👋</div>';return}
    box.innerHTML=d.msgs.map(function(m){var mine=PT&&PINFO.main?m.from===STATE.chatWho:m.from===d.me;
      var face=m.from==='بابا'?'<span class="av" style="width:30px;height:30px;background:#1f4e78">👨</span>':m.from==='ماما'?'<span class="av" style="width:30px;height:30px;background:#be185d">👩</span>':av((CHAT_PH||{})[m.from],m.name,30);
      var tm=new Date(m.t);tm=('0'+tm.getHours()).slice(-2)+':'+('0'+tm.getMinutes()).slice(-2)+' — '+tm.getDate()+'/'+(tm.getMonth()+1);
      return'<div class="m '+(mine?'me':'')+'">'+face+'<div class="bub"><b>'+esc(m.name)+'</b><div>'+esc(m.text).replace(/\n/g,'<br>')+'</div>'+evBtn(m.file)+'<span class="muted" style="font-size:11px">'+tm+'</span></div></div>'}).join('');
    if(scroll||atEnd)box.scrollTop=box.scrollHeight}).catch(function(){})}
function pickChatFile(inp){readFile(inp.files[0],1280,.7).then(function(d){STATE.chatFile=d;$('catt').firstChild.textContent='✅ الملف جاهز '})}
function chatSend(){var t=$('ct').value;if(!t.trim()&&!STATE.chatFile)return;$('cgo').disabled=true;
  var tok=PT||TOKEN;
  call('apiChatSend',tok,t,STATE.chatWho,STATE.chatFile).then(function(){$('ct').value='';STATE.chatFile='';
    $('catt').firstChild.textContent='📎 صورة أو صوت ';$('cgo').disabled=false;chatLoad(true)}).catch(function(){$('cgo').disabled=false})}

boot();
</script>
